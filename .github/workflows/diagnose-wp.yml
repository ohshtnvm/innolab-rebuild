# Manual, read-only check of how WordPress outputs the published pages.
name: Diagnose WordPress output

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated page slugs to look up (optional)"
        required: false
        default: ""

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/diagnose_wp.py
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DIAG_SLUGS: ${{ inputs.slugs }}
