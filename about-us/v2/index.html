<style>
:root{
  --green:#8dc63f;
  --ink:#101814;
  --forest:#14362a;
  --forest2:#0b2118;
  --paper:#f3f5f1;
  --white:#fff;
  --line:#dfe4dc;
  --muted:#657068;
  --max:1280px;
  --pad:28px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.58;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:'Inter Tight','Inter',sans-serif;letter-spacing:-.035em;line-height:1}
h1,h2,h3,p{margin-top:0}
img{display:block;width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit}
.wrap{max-width:var(--max);margin:auto;padding:0 var(--pad)}
.section{padding:108px 0}
.kicker{font-family:'Inter Tight';font-weight:800;letter-spacing:.15em;text-transform:uppercase;font-size:.72rem;color:var(--green)}
.kicker.dark{color:var(--forest)}
.section-title{font-size:clamp(2.5rem,5vw,5rem);margin:0}
.lead{color:var(--muted);font-size:1.08rem;max-width:650px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:15px 24px;border:1px solid transparent;font-family:'Inter Tight';font-weight:800;text-decoration:none;cursor:pointer;transition:.18s}
.btn:hover{transform:translateY(-2px)}
.btn-green{background:var(--green);color:#102013}
.btn-light{background:#fff;color:var(--ink)}
.btn-outline{border-color:rgba(255,255,255,.5);color:#fff;background:transparent}
.btn-dark-outline{border-color:var(--line);background:#fff}
.textlink{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:'Inter Tight';font-weight:800}
.arrow{display:inline-block;transition:.2s}
.textlink:hover .arrow{transform:translateX(5px)}

/* Header */
header{position:sticky;top:0;z-index:90;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid transparent}
header.scrolled{border-color:var(--line)}
.nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:26px}
.logo img{height:30px;width:auto}
.mainnav{display:flex;align-items:center;gap:4px}
.navitem{position:relative}
.navlink{display:flex;align-items:center;gap:6px;padding:10px 11px;border-radius:8px;text-decoration:none;font-size:.93rem;font-weight:600}
.navlink:hover{background:var(--paper)}
.caret{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-3px}
.drop{position:absolute;top:100%;left:0;min-width:230px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 50px rgba(16,24,20,.14);opacity:0;visibility:hidden;transform:translateY(7px);transition:.18s}
.navitem:hover .drop{opacity:1;visibility:visible;transform:translateY(3px)}
.drop a{display:block;padding:9px 11px;border-radius:8px;text-decoration:none;font-size:.9rem}
.drop a:hover{background:var(--paper)}
.navright{display:flex;align-items:center;gap:10px}
.navcta{padding:11px 17px}
.toggle{display:none;width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:50%;cursor:pointer}
.toggle i,.toggle i:before,.toggle i:after{content:'';display:block;width:18px;height:2px;background:var(--ink);position:relative;margin:auto}
.toggle i:before{position:absolute;top:-6px}.toggle i:after{position:absolute;top:6px}

/* Hero */
.hero{background:var(--forest2);color:#fff;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;min-height:720px}
.hero-copy{padding:105px 72px 100px max(var(--pad),calc((100vw - var(--max))/2 + var(--pad)));display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(4rem,7.7vw,7.6rem);max-width:9.2ch;margin:24px 0 28px;color:#fff}
.hero-sub{font-size:1.1rem;color:rgba(255,255,255,.75);max-width:610px;margin-bottom:30px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-visual{position:relative;min-height:720px;background:#244736}
.hero-visual img{position:absolute;inset:0;height:100%;object-fit:cover}
.hero-visual:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--forest2) 0%,rgba(11,33,24,.2) 34%,rgba(11,33,24,.08))}
.hero-badge{position:absolute;left:38px;bottom:34px;z-index:2;max-width:340px;background:rgba(11,33,24,.78);backdrop-filter:blur(9px);padding:23px 25px;border-left:4px solid var(--green)}
.hero-badge span{font-family:'Inter Tight';font-size:1.16rem;font-weight:700;line-height:1.2}

/* proof strip */
.proof{background:var(--green)}
.proof-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.proof-item{padding:28px 24px;border-right:1px solid rgba(16,24,20,.15)}
.proof-item:last-child{border-right:0}
.proof-item strong{display:block;font-family:'Inter Tight';font-size:2.25rem;line-height:1}
.proof-item span{display:block;font-size:.84rem;font-weight:700;margin-top:7px}

/* Manifesto */
.manifesto{background:#fff}
.manifesto-grid{display:grid;grid-template-columns:.66fr 1.34fr;gap:88px}
.manifesto-copy{font-family:'Inter Tight';font-size:clamp(2.2rem,4.5vw,4.3rem);font-weight:700;line-height:1.08;letter-spacing:-.04em}
.manifesto-copy .soft{color:#a0aaa3}
.manifesto-link{margin-top:28px}

/* Built differently */
.built{background:var(--paper)}
.built-head{display:grid;grid-template-columns:1fr .8fr;gap:70px;align-items:end;margin-bottom:58px}
.built-list{border-top:1px solid var(--line)}
.built-row{display:grid;grid-template-columns:78px .78fr 1.22fr 260px;gap:30px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}
.built-no{font-family:'Inter Tight';font-weight:800;color:var(--green)}
.built-row h3{font-size:1.6rem;margin:0}
.built-row p{color:var(--muted);font-size:.94rem;margin:0}
.built-img{height:135px;overflow:hidden;background:#ddd}
.built-img img{height:100%;object-fit:cover;transition:.3s}
.built-row:hover .built-img img{transform:scale(1.05)}

/* disciplines */
.disciplines{background:var(--forest);color:#fff}
.discipline-head{display:grid;grid-template-columns:.8fr 1.2fr;gap:80px;margin-bottom:58px}
.discipline-head .section-title{color:#fff}
.discipline-head .lead{color:rgba(255,255,255,.66)}
.discipline-grid{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid rgba(255,255,255,.15);border-bottom:1px solid rgba(255,255,255,.15)}
.discipline{min-height:260px;padding:24px 18px;border-right:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
.discipline:last-child{border-right:0}
.discipline:hover{background:var(--green);color:var(--ink)}
.discipline .num{font-family:'Inter Tight';font-weight:800;color:var(--green)}
.discipline:hover .num{color:var(--ink)}
.discipline h3{font-size:1.35rem;line-height:1.08;margin:0}
.discipline p{font-size:.84rem;color:rgba(255,255,255,.62);margin-top:10px}
.discipline:hover p{color:rgba(16,24,20,.72)}

/* 24 hour */
.workday{background:#fff}
.workday-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:80px;align-items:start}
.workday-sticky{position:sticky;top:112px}
.workday-sticky h2{max-width:8ch}
.timeline{position:relative;border-left:1px solid var(--line)}
.timeline:before{content:'';position:absolute;left:-1px;top:0;width:1px;height:100%;background:linear-gradient(var(--green),var(--forest))}
.time-step{position:relative;padding:0 0 48px 42px}
.time-step:last-child{padding-bottom:0}
.time-step:before{content:'';position:absolute;left:-7px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--green);border:3px solid #fff}
.time{font-family:'Inter Tight';font-size:.76rem;font-weight:800;color:var(--green);letter-spacing:.12em;text-transform:uppercase}
.time-step h3{font-size:1.5rem;margin:7px 0 9px}
.time-step p{color:var(--muted);font-size:.94rem;max-width:600px}
.time-proof{margin-top:50px;padding:26px;background:var(--paper);border-left:4px solid var(--green);font-family:'Inter Tight';font-weight:700;font-size:1.28rem}

/* operating model */
.model{background:var(--paper)}
.model-head{display:grid;grid-template-columns:1fr .85fr;gap:72px;align-items:end;margin-bottom:52px}
.model-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.model-step{padding:30px 24px;min-height:320px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.model-step:last-child{border-right:0}
.model-step .num{font-family:'Inter Tight';font-weight:800;color:var(--green)}
.model-step h3{font-size:1.55rem;margin:48px 0 12px}
.model-step p{font-size:.92rem;color:var(--muted)}
.model-step .line{height:4px;width:42px;background:var(--green);margin-top:auto}

/* focus */
.focus{background:#fff}
.focus-head{display:grid;grid-template-columns:.86fr 1.14fr;gap:72px;align-items:end;margin-bottom:42px}
.focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.focus-card{position:relative;min-height:420px;overflow:hidden;background:var(--forest);color:#fff;text-decoration:none}
.focus-card img{position:absolute;inset:0;height:100%;object-fit:cover;transition:.4s}
.focus-card:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,13,8,.02) 24%,rgba(5,18,11,.89))}
.focus-card:hover img{transform:scale(1.04)}
.focus-body{position:absolute;z-index:2;left:25px;right:25px;bottom:24px}
.focus-body .tag{font-size:.73rem;color:var(--green);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.focus-body h3{font-size:2rem;margin:8px 0 6px;color:#fff}
.focus-body p{font-size:.9rem;color:rgba(255,255,255,.67);margin-bottom:0}

/* closing */
.closing{background:var(--forest2);color:#fff;overflow:hidden}
.closing-grid{display:grid;grid-template-columns:1.04fr .96fr;min-height:520px}
.closing-copy{padding:98px 72px 88px max(var(--pad),calc((100vw - var(--max))/2 + var(--pad)))}
.closing-copy h2{font-size:clamp(3rem,6vw,6rem);max-width:8.7ch;margin:18px 0 24px;color:#fff}
.closing-copy p{max-width:600px;color:rgba(255,255,255,.7)}
.closing-image{position:relative}
.closing-image img{position:absolute;inset:0;height:100%;object-fit:cover}
.closing-image:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--forest2),transparent 38%)}

/* modal */
.modal{position:fixed;inset:0;z-index:120;background:rgba(5,14,9,.82);backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;padding:38px 18px;overflow:auto}
.modal.open{display:flex}
html.is-embedded .modal{position:absolute}
html.is-embedded #header,html.is-embedded #footer,html.is-embedded #toTop{display:none}
.modal-card{width:min(570px,100%);background:#fff;padding:32px;position:relative}
.modal-close{position:absolute;right:14px;top:14px;border:0;width:38px;height:38px;border-radius:50%;background:var(--paper);font-size:1.3rem;cursor:pointer}
.modal-card h3{font-size:1.8rem;margin-bottom:6px}
.modal-card .sub{color:var(--muted);font-size:.93rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin:13px 0}
.field label{display:block;font-size:.79rem;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);background:#fff}
.form-foot{display:flex;flex-direction:column;gap:10px}
.form-status{font-size:.86rem;font-weight:600;color:var(--forest)}
.mailto{font-size:.83rem;color:var(--muted)}

/* footer */
footer{background:#08170f;color:rgba(255,255,255,.68);padding:60px 0 28px}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:40px;margin-bottom:42px}
.footer-logo img{width:auto;height:29px;filter:brightness(0) invert(1)}
footer h4{color:#fff;text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;margin:0 0 15px}
footer a{display:block;color:rgba(255,255,255,.68);text-decoration:none;padding:4px 0;font-size:.9rem}
footer a:hover{color:var(--green)}
.footer-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:23px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.8rem}
#toTop{position:fixed;right:22px;bottom:22px;width:45px;height:45px;border:0;border-radius:50%;background:var(--forest);color:#fff;z-index:60;opacity:0;visibility:hidden;transition:.2s;cursor:pointer}
#toTop.show{opacity:1;visibility:visible}

/* reveal */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}

@media(max-width:1060px){
  .hero-grid,.manifesto-grid,.built-head,.discipline-head,.workday-grid,.model-head,.focus-head,.closing-grid{grid-template-columns:1fr}
  .hero-copy{padding:92px var(--pad)}
  .hero-visual{min-height:560px}
  .manifesto-grid{gap:25px}
  .built-row{grid-template-columns:58px .8fr 1.2fr}
  .built-img{grid-column:2/-1;height:220px}
  .discipline-grid{grid-template-columns:repeat(3,1fr)}
  .discipline:nth-child(3){border-right:0}
  .discipline:nth-child(-n+3){border-bottom:1px solid rgba(255,255,255,.15)}
  .workday-sticky{position:static}
  .model-grid{grid-template-columns:1fr 1fr}
  .model-step:nth-child(2){border-right:0}
  .model-step:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .closing-copy{padding:90px var(--pad)}
  .closing-image{min-height:430px}
  .closing-image:after{background:linear-gradient(180deg,var(--forest2),transparent 30%)}
  .footer-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:850px){
  .mainnav{display:none}
  .mainnav.open{display:flex;position:absolute;top:74px;left:0;right:0;background:#fff;padding:12px var(--pad);flex-direction:column;align-items:stretch;border-bottom:1px solid var(--line)}
  .mainnav.open .navitem{width:100%}
  .mainnav.open .drop{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:0;padding-left:14px}
  .navright .navcta{display:none}
  .toggle{display:block}
  .proof-grid{grid-template-columns:1fr 1fr}
  .proof-item:nth-child(2){border-right:0}
  .proof-item:nth-child(-n+2){border-bottom:1px solid rgba(16,24,20,.15)}
  .focus-grid{grid-template-columns:1fr}
}
@media(max-width:650px){
  :root{--pad:20px}
  .section{padding:78px 0}
  .hero h1{font-size:clamp(3.2rem,16vw,5rem)}
  .hero-visual{min-height:430px}
  .hero-badge{left:20px;right:20px;bottom:20px}
  .proof-grid,.discipline-grid,.model-grid,.footer-grid,.form-row{grid-template-columns:1fr}
  .proof-item,.proof-item:nth-child(2){border-right:0;border-bottom:1px solid rgba(16,24,20,.15)}
  .proof-item:last-child{border-bottom:0}
  .built-row{grid-template-columns:48px 1fr}
  .built-row p,.built-img{grid-column:2}
  .built-img{height:180px}
  .discipline,.discipline:nth-child(3){border-right:0;border-bottom:1px solid rgba(255,255,255,.15)}
  .discipline{min-height:180px}
  .model-step,.model-step:nth-child(2){border-right:0;border-bottom:1px solid var(--line)}
  .model-step:last-child{border-bottom:0}
  .closing-copy h2{font-size:3.6rem}
}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none}
}
</style>
</head>

<script>
const FORM_ENDPOINT='https://www.base-4.com/wp-json/base4/v1/lead';
const db={};
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function parseTSV(text){
  text.split('# SHEET: ').map(x=>x.trim()).filter(Boolean).forEach(block=>{
    const lines=block.split(/\r?\n/).filter(l=>l.length&&!l.startsWith('#'));
    if(!lines.length)return;
    const name=lines.shift().trim();
    const heads=lines.shift().split('\t').map(x=>x.trim());
    db[name]=lines.map(line=>{
      const cells=line.split('\t'),row={};
      heads.forEach((h,i)=>row[h]=(cells[i]||'').trim());
      return row;
    });
  });
}
function kv(name){const o={};(db[name]||[]).forEach(r=>o[r.Parameter]=r.Value);return o}

function renderNav(){
  document.getElementById('mainNav').innerHTML=(db.Nav||[]).map(n=>{
    const kids=(n.children||'').split('||').filter(Boolean).map(c=>{
      const [l,h]=c.split('::');
      return `<a href="${esc(h)}">${esc(l)}</a>`;
    }).join('');
    return `<div class="navitem"><a class="navlink" href="${esc(n.href)}">${esc(n.label)}${kids?'<span class="caret"></span>':''}</a>${kids?`<div class="drop">${kids}</div>`:''}</div>`;
  }).join('');
}

function renderFooter(){
  const s=kv('Site'),n=db.Nav||[];
  document.getElementById('footer').innerHTML=`<div class="wrap">
    <div class="footer-grid">
      <div><a class="footer-logo" href="https://www.base-4.com/"><img src="https://ohshtnvm.github.io/innolab-rebuild/6-29-iteration/logos/base4-logo.png" alt="BASE4"></a><p style="max-width:34ch;font-size:.9rem;margin-top:15px">${esc(s['Footer Blurb'])}</p></div>
      <div><h4>Explore</h4>${n.slice(0,3).map(x=>`<a href="${esc(x.href)}">${esc(x.label)}</a>`).join('')}</div>
      <div><h4>Company</h4>${n.slice(3,6).map(x=>`<a href="${esc(x.href)}">${esc(x.label)}</a>`).join('')}</div>
      <div><h4>Start a Project</h4><p style="font-size:.9rem">Have a site, concept, brand, prototype, or project challenge?</p><button class="btn btn-green js-consult" type="button">Discuss Your Project</button></div>
    </div>
    <div class="footer-bottom"><span>${esc(s.Copyright)}</span><span>${esc(s['Florida Registration'])}</span></div>
  </div>`;
}

function render(){
  const H=kv('Hero'),M=kv('Manifesto'),BI=kv('BuiltIntro'),DI=kv('DisciplinesIntro'),
        WI=kv('WorkdayIntro'),MI=kv('ModelIntro'),FI=kv('FocusIntro'),C=kv('Closing');

  const proof=(db.Proof||[]).map(r=>`<div class="proof-item"><strong>${esc(r.num)}</strong><span>${esc(r.label)}</span></div>`).join('');

  const built=(db.Built||[]).map(r=>`<article class="built-row reveal">
    <div class="built-no">${esc(r.num)}</div>
    <h3>${esc(r.title)}</h3>
    <p>${esc(r.body)}</p>
    <div class="built-img"><img src="${esc(r.image)}" alt="${esc(r.title)}" loading="lazy"></div>
  </article>`).join('');

  const disciplines=(db.Disciplines||[]).map(r=>`<article class="discipline reveal">
    <div class="num">${esc(r.num)}</div>
    <div><h3>${esc(r.name)}</h3><p>${esc(r.body)}</p></div>
  </article>`).join('');

  const day=(db.Workday||[]).map(r=>`<div class="time-step reveal">
    <div class="time">${esc(r.time)}</div>
    <h3>${esc(r.title)}</h3>
    <p>${esc(r.body)}</p>
  </div>`).join('');

  const model=(db.Model||[]).map(r=>`<article class="model-step reveal">
    <div class="num">${esc(r.num)}</div>
    <h3>${esc(r.title)}</h3>
    <p>${esc(r.body)}</p>
    <div class="line"></div>
  </article>`).join('');

  const focus=(db.Focus||[]).map(r=>`<a class="focus-card reveal" href="${esc(r.href)}">
    <img src="${esc(r.image)}" alt="${esc(r.name)} project by BASE4" loading="lazy">
    <div class="focus-body">
      <div class="tag">${esc(r.tag)}</div>
      <h3>${esc(r.name)}</h3>
      <p>${esc(r.body)}</p>
    </div>
  </a>`).join('');

  document.getElementById('app').innerHTML=`
    <section class="hero">
      <div class="hero-grid">
        <div class="hero-copy">
          <div class="kicker reveal">${esc(H.Eyebrow)}</div>
          <h1 class="reveal">${esc(H.H1)}</h1>
          <p class="hero-sub reveal">${esc(H.Subhead)}</p>
          <div class="hero-actions reveal">
            <a class="btn btn-green" href="#how-we-work">${esc(H['Primary CTA'])}</a>
            <button class="btn btn-outline js-consult" type="button">${esc(H['Secondary CTA'])}</button>
          </div>
        </div>
        <div class="hero-visual">
          <img src="${esc(H.Image)}" alt="BASE4 team and project work">
          <div class="hero-badge"><span>${esc(H.Badge)}</span></div>
        </div>
      </div>
    </section>

    <section class="proof"><div class="wrap"><div class="proof-grid">${proof}</div></div></section>

    <section class="section manifesto">
      <div class="wrap">
        <div class="manifesto-grid">
          <div class="reveal"><div class="kicker dark">${esc(M.Eyebrow)}</div></div>
          <div>
            <div class="manifesto-copy reveal">${esc(M.Body)} <span class="soft">${esc(M['Soft Body'])}</span></div>
            <div class="manifesto-link reveal"><a class="textlink" href="${esc(M['Primary URL'])}">${esc(M['Primary CTA'])} <span class="arrow">→</span></a></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section built">
      <div class="wrap">
        <div class="built-head">
          <div><div class="kicker dark reveal">${esc(BI.Eyebrow)}</div><h2 class="section-title reveal">${esc(BI.Title)}</h2></div>
          <p class="lead reveal">${esc(BI.Body)}</p>
        </div>
        <div class="built-list">${built}</div>
      </div>
    </section>

    <section class="section disciplines">
      <div class="wrap">
        <div class="discipline-head">
          <div><div class="kicker reveal">${esc(DI.Eyebrow)}</div><h2 class="section-title reveal">${esc(DI.Title)}</h2></div>
          <p class="lead reveal">${esc(DI.Body)}</p>
        </div>
        <div class="discipline-grid">${disciplines}</div>
      </div>
    </section>

    <section class="section workday" id="how-we-work">
      <div class="wrap workday-grid">
        <div class="workday-sticky">
          <div class="kicker dark reveal">${esc(WI.Eyebrow)}</div>
          <h2 class="section-title reveal">${esc(WI.Title)}</h2>
          <p class="lead reveal">${esc(WI.Body)}</p>
          <div class="time-proof reveal">${esc(WI['Pull Quote'])}</div>
        </div>
        <div class="timeline">${day}</div>
      </div>
    </section>

    <section class="section model">
      <div class="wrap">
        <div class="model-head">
          <div><div class="kicker dark reveal">${esc(MI.Eyebrow)}</div><h2 class="section-title reveal">${esc(MI.Title)}</h2></div>
          <p class="lead reveal">${esc(MI.Body)}</p>
        </div>
        <div class="model-grid">${model}</div>
      </div>
    </section>

    <section class="section focus">
      <div class="wrap">
        <div class="focus-head">
          <div><div class="kicker dark reveal">${esc(FI.Eyebrow)}</div><h2 class="section-title reveal">${esc(FI.Title)}</h2></div>
          <p class="lead reveal">${esc(FI.Body)}</p>
        </div>
        <div class="focus-grid">${focus}</div>
      </div>
    </section>

    <section class="closing">
      <div class="closing-grid">
        <div class="closing-copy reveal">
          <div class="kicker">${esc(C.Eyebrow)}</div>
          <h2>${esc(C.Title)}</h2>
          <p>${esc(C.Body)}</p>
          <button class="btn btn-green js-consult" type="button">${esc(C.Button)}</button>
        </div>
        <div class="closing-image"><img src="${esc(C.Image)}" alt="BASE4 integrated design team" loading="lazy"></div>
      </div>
    </section>`;

  document.querySelectorAll('.js-consult').forEach(b=>b.addEventListener('click',openModal));
  reveal();
}

function renderForm(){
  const f=kv('Form'),s=kv('Site');
  formTitle.textContent=f.Title||'';
  formSub.textContent=f.Subhead||'';
  nameLabel.textContent=f['Name Label']||'';
  companyLabel.textContent=f['Company Label']||'';
  emailLabel.textContent=f['Email Label']||'';
  locationLabel.textContent=f['Location Label']||'';
  locationInput.placeholder=f['Location Placeholder']||'';
  typeLabel.textContent=f['Type Label']||'';
  projectType.innerHTML=(f['Type Options']||'').split('||').map(x=>`<option>${esc(x)}</option>`).join('');
  messageLabel.textContent=f['Message Label']||'';
  messageInput.placeholder=f['Message Placeholder']||'';
  submitLabel.textContent=f['Submit Label']||'';
  mailFallback.innerHTML=`${esc(f['Fallback Prefix'])} <a href="mailto:${esc(s.Email)}?subject=${encodeURIComponent(s['Mailto Subject']||'')}">${esc(s.Email)}</a>`;
}

function openModal(){consultModal.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('[name="name"]')?.focus(),70)}
function closeModal(){consultModal.classList.remove('open');document.body.style.overflow=''}

function reveal(){
  const els=[...document.querySelectorAll('.reveal')];
  if(!('IntersectionObserver' in window)){els.forEach(x=>x.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.07});
  els.forEach(x=>io.observe(x));
}

function embed(){
  try{
    if(self!==top){
      document.documentElement.classList.add('is-embedded');
      const send=()=>parent.postMessage({type:'base4-height',height:document.documentElement.scrollHeight},'*');
      new ResizeObserver(send).observe(document.body);send();
    }
  }catch(e){}
}

document.addEventListener('DOMContentLoaded',()=>{
  parseTSV(document.getElementById('content-tsv').textContent);
  renderNav();renderFooter();renderForm();render();embed();

  navToggle.addEventListener('click',()=>mainNav.classList.toggle('open'));
  addEventListener('scroll',()=>{header.classList.toggle('scrolled',scrollY>16);toTop.classList.toggle('show',scrollY>700)},{passive:true});
  toTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
  modalClose.addEventListener('click',closeModal);
  consultModal.addEventListener('click',e=>{if(e.target===consultModal)closeModal()});
  addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

  leadForm.addEventListener('submit',async e=>{
    e.preventDefault();
    const s=kv('Site'),data=Object.fromEntries(new FormData(leadForm).entries());
    if(data.company_website)return;
    formStatus.hidden=false;formStatus.textContent='Sending...';
    try{
      const r=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,source:s['Lead Source']})});
      if(!r.ok)throw 0;
      formStatus.textContent='Thank you. The BASE4 team will follow up.';
      leadForm.reset();
    }catch(err){
      formStatus.innerHTML=`Could not submit automatically. Please email <a href="mailto:${esc(s.Email)}">${esc(s.Email)}</a>.`;
    }
  });
});
</script>
