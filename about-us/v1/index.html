  <style>
    :root{
      --accent:#8dc63f;
      --accent-soft:#edf7df;
      --accent-ink:#0E1A14;
      --ink:#0E1A14;
      --deep:#1C3A2E;
      --deep-2:#11281f;
      --surface:#FFFFFF;
      --surface-alt:#F5F7F4;
      --hairline:#E3E8E1;
      --muted:#5b6b61;
      --max:1200px;
      --pad:24px;
      --radius:16px;
      --radius-lg:24px;
      --shadow:0 1px 2px rgba(14,26,20,.04),0 8px 24px rgba(14,26,20,.06);
      --shadow-lg:0 18px 54px rgba(14,26,20,.16);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:1.0625rem;line-height:1.6;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
    h1,h2,h3,h4,.display{font-family:'Inter Tight','Inter',sans-serif;line-height:1.08;letter-spacing:-.02em;font-weight:700}
    h1{font-size:clamp(3rem,6vw,5.25rem);margin:0 0 .34em}
    h2{font-size:clamp(2rem,4vw,3.25rem);margin:0 0 .45em}
    h3{font-size:1.25rem;margin:0 0 .45em}
    p{margin:0 0 1em}
    img{max-width:100%;display:block}
    a{color:inherit}
    button,input,select,textarea{font:inherit}
    .wrap{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
    .section{padding:96px 0}
    .section--alt{background:var(--surface-alt)}
    .eyebrow{font-family:'Inter Tight';font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.77rem;color:var(--deep);margin:0 0 18px}
    .eyebrow .dot{color:var(--accent)}
    .lead{font-size:1.15rem;color:var(--muted);max-width:64ch}
    .center{text-align:center;margin-left:auto;margin-right:auto}
    .tnum{font-variant-numeric:tabular-nums}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;font-family:'Inter Tight';font-weight:700;font-size:1rem;padding:15px 26px;border-radius:999px;border:2px solid transparent;text-decoration:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease,border-color .15s ease}
    .btn:hover{transform:translateY(-2px)}
    .btn--primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(141,198,63,.30)}
    .btn--primary:hover{box-shadow:0 10px 28px rgba(141,198,63,.42)}
    .btn--ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.48)}
    .btn--ghost:hover{background:rgba(255,255,255,.08);border-color:#fff}
    .btn--dark{background:var(--deep);color:#fff}
    .btn--outline{background:transparent;color:var(--deep);border-color:var(--hairline)}
    .btn--outline:hover{border-color:var(--deep)}

    /* Header */
    header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid transparent;transition:border-color .2s ease,box-shadow .2s ease}
    header.scrolled{border-color:var(--hairline);box-shadow:0 1px 0 rgba(14,26,20,.04)}
    .nav-bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 0;transition:padding .2s ease}
    header.scrolled .nav-bar{padding:9px 0}
    .brand{display:flex;align-items:center;text-decoration:none}
    .brand img{height:32px;width:auto;display:block;transition:height .2s ease}
    header.scrolled .brand img{height:28px}
    .main-nav{display:flex;align-items:center;gap:4px}
    .nav-item{position:relative}
    .nav-link{display:inline-flex;align-items:center;gap:5px;padding:10px 12px;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink);border-radius:8px}
    .nav-link:hover,.nav-link.active{background:var(--surface-alt)}
    .caret{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-3px;transition:transform .2s}
    .dropdown{position:absolute;top:100%;left:0;min-width:230px;background:#fff;border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;opacity:0;visibility:hidden;transform:translateY(6px);transition:all .18s ease}
    .nav-item:hover .dropdown{opacity:1;visibility:visible;transform:translateY(4px)}
    .nav-item:hover .caret{transform:rotate(225deg);margin-top:2px}
    .dropdown a{display:block;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem;font-weight:500}
    .dropdown a:hover{background:var(--surface-alt);color:var(--deep)}
    .header-right{display:flex;align-items:center;gap:14px}
    .socials{display:flex;gap:8px}
    .socials a{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--deep);border:1px solid var(--hairline);transition:.15s}
    .socials a:hover{background:var(--deep);color:#fff;border-color:var(--deep)}
    .socials svg{width:16px;height:16px}
    .nav-toggle{display:none;background:none;border:1px solid var(--hairline);border-radius:8px;width:42px;height:42px;cursor:pointer;align-items:center;justify-content:center}
    .nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{content:'';display:block;width:18px;height:2px;background:var(--ink);position:relative;transition:.2s}
    .nav-toggle span::before{position:absolute;top:-6px}.nav-toggle span::after{position:absolute;top:6px}

    /* Hero */
    .hero{position:relative;color:#fff;overflow:hidden;isolation:isolate;background:var(--deep);min-height:650px;display:flex;align-items:stretch}
    .hero-bg{position:absolute;inset:0;z-index:-2;background-position:center;background-size:cover;transform:scale(1.01)}
    .hero::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,rgba(10,25,18,.96) 0%,rgba(20,47,36,.88) 43%,rgba(20,47,36,.52) 72%,rgba(20,47,36,.32) 100%)}
    .hero-inner{padding-top:118px;padding-bottom:108px;width:100%;display:flex;align-items:center}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.65fr);gap:72px;align-items:end;width:100%}
    .hero-copy{max-width:760px}
    .hero h1{color:#fff;max-width:13ch}
    .hero p.sub{font-size:1.18rem;color:rgba(255,255,255,.88);max-width:62ch;margin-bottom:30px}
    .hero .eyebrow{color:rgba(255,255,255,.78)}
    .hero-cta{display:flex;gap:14px;flex-wrap:wrap}
    .hero-note{border-left:1px solid rgba(255,255,255,.32);padding-left:24px;color:rgba(255,255,255,.78);font-size:.94rem;max-width:33ch}
    .hero-note strong{display:block;color:#fff;font-family:'Inter Tight';font-size:1.05rem;margin-bottom:5px}

    /* Proof strip */
    .stats-wrap{margin-top:-44px;position:relative;z-index:5}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden}
    .stat{padding:27px 25px;min-height:122px;display:flex;flex-direction:column;justify-content:center}
    .stat+.stat{border-left:1px solid var(--hairline)}
    .stat .num{font-family:'Inter Tight';font-size:2.35rem;line-height:1;font-weight:800;color:var(--deep)}
    .stat .label{font-weight:700;font-size:.92rem;margin-top:8px}
    .stat .sub{color:var(--muted);font-size:.78rem;margin-top:3px}

    /* Intro editorial */
    .story-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:72px;align-items:center}
    .story-media{position:relative}
    .story-media img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--radius-lg);box-shadow:var(--shadow)}
    .story-badge{position:absolute;right:-22px;bottom:28px;max-width:280px;background:var(--deep);color:#fff;padding:24px 26px;border-radius:16px;box-shadow:var(--shadow-lg);font-family:'Inter Tight';font-weight:700;font-size:1.15rem;line-height:1.35}
    .story-badge span{color:var(--accent)}
    .story-copy h2{max-width:13ch}
    .story-copy .lead{margin-bottom:18px}
    .story-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}

    /* Advantage */
    .section-head{display:grid;grid-template-columns:.72fr 1.28fr;gap:50px;align-items:end;margin-bottom:42px}
    .section-head h2{margin:0;max-width:14ch}
    .section-head .lead{margin:0;max-width:58ch}
    .adv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .adv-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:100%}
    .adv-media{aspect-ratio:16/10;overflow:hidden;background:var(--surface-alt)}
    .adv-media img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
    .adv-card:hover .adv-media img{transform:scale(1.045)}
    .adv-body{padding:24px;display:flex;flex-direction:column;flex:1}
    .adv-index{font-family:'Inter Tight';font-weight:800;font-size:.78rem;letter-spacing:.12em;color:var(--accent);margin-bottom:11px}
    .adv-body p{color:var(--muted);font-size:.96rem;margin:0}

    /* Disciplines */
    .disciplines{background:var(--deep);color:#fff;overflow:hidden}
    .disciplines .eyebrow{color:rgba(255,255,255,.68)}
    .disciplines h2{color:#fff;max-width:15ch}
    .disciplines .lead{color:rgba(255,255,255,.72)}
    .disc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.13);border-radius:var(--radius-lg);overflow:hidden;margin-top:44px}
    .disc{background:var(--deep);padding:30px;min-height:230px;display:flex;flex-direction:column}
    .disc .ico{width:46px;height:46px;border-radius:12px;background:rgba(141,198,63,.14);display:grid;place-items:center;color:var(--accent);margin-bottom:30px}
    .disc .ico svg{width:23px;height:23px}
    .disc h3{color:#fff}
    .disc p{font-size:.92rem;color:rgba(255,255,255,.64);margin-bottom:22px}
    .disc a{margin-top:auto;color:var(--accent);font-family:'Inter Tight';font-weight:700;text-decoration:none;font-size:.88rem}

    /* Operating model */
    .model-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:72px;align-items:start}
    .model-copy{position:sticky;top:110px}
    .steps{border-top:1px solid var(--hairline)}
    .step{display:grid;grid-template-columns:82px 1fr;gap:24px;padding:30px 0;border-bottom:1px solid var(--hairline)}
    .step-num{font-family:'Inter Tight';font-size:1rem;font-weight:800;color:var(--accent)}
    .step h3{font-size:1.35rem;margin-bottom:7px}
    .step p{color:var(--muted);font-size:.98rem;margin:0;max-width:62ch}

    /* Markets */
    .market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:42px}
    .market{position:relative;overflow:hidden;border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:30px;min-height:350px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column}
    .market::before{content:'';position:absolute;inset:auto -70px -100px auto;width:240px;height:240px;border-radius:50%;background:var(--accent-soft)}
    .market-kicker{font-family:'Inter Tight';font-weight:800;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:relative}
    .market h3{font-size:1.8rem;margin-top:auto;position:relative}
    .market p{color:var(--muted);font-size:.96rem;position:relative;max-width:31ch}
    .market a{position:relative;font-family:'Inter Tight';font-weight:700;color:var(--deep);text-decoration:none;margin-top:8px}

    /* Closing */
    .closing{position:relative;color:#fff;text-align:center;overflow:hidden;isolation:isolate}
    .closing-bg{position:absolute;inset:0;z-index:-2;background-position:center;background-size:cover}
    .closing::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,24,17,.82),rgba(20,48,36,.92))}
    .closing .inner{padding:110px 0;max-width:760px;margin:0 auto}
    .closing .eyebrow{color:rgba(255,255,255,.68)}
    .closing h2{color:#fff}
    .closing p{color:rgba(255,255,255,.80);font-size:1.08rem}

    /* Modal */
    .modal{position:fixed;inset:0;background:rgba(10,18,14,.78);backdrop-filter:blur(4px);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
    .modal.open{display:flex}
    html.is-embedded .modal{position:absolute}
    html.is-embedded #toTop{display:none}
    html.is-embedded #header,html.is-embedded #footer{display:none}
    .modal-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);max-width:560px;width:100%;padding:30px;position:relative}
    .modal-card h3{color:var(--ink);margin-bottom:4px;font-size:1.45rem}
    .modal-card .sub{color:var(--muted);font-size:.95rem;margin-bottom:18px}
    .modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:var(--surface-alt);border:none;color:var(--ink);font-size:1.3rem;cursor:pointer;line-height:1}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--hairline);border-radius:10px;font:inherit;font-size:.95rem;color:var(--ink);background:#fff}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(141,198,63,.25)}
    .form-foot{display:flex;flex-direction:column;gap:10px;margin-top:4px}
    .mailto-fallback{font-size:.85rem;color:var(--muted)}
    .mailto-fallback a{color:var(--deep);font-weight:600}
    .form-status{margin:12px 0 0;font-size:.9rem;font-weight:600;color:var(--deep)}

    /* Footer */
    footer{background:var(--ink);color:rgba(255,255,255,.72);padding:64px 0 32px}
    .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.4fr;gap:36px;margin-bottom:44px}
    footer h4{color:#fff;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
    footer a{color:rgba(255,255,255,.72);text-decoration:none;display:block;padding:5px 0;font-size:.93rem}
    footer a:hover{color:var(--accent)}
    .footer-brand .brand-logo img{height:30px;width:auto;filter:brightness(0) invert(1)}
    .footer-brand p{font-size:.92rem;margin-top:14px;max-width:34ch}
    .news-form{display:flex;gap:8px;margin-top:12px}
    .news-form input{flex:1;padding:11px 13px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);border-radius:10px;color:#fff;font:inherit;font-size:.9rem;min-width:0}
    .news-form input::placeholder{color:rgba(255,255,255,.45)}
    .news-form button{border:none;background:var(--accent);color:var(--accent-ink);font-family:'Inter Tight';font-weight:700;border-radius:10px;padding:0 16px;cursor:pointer}
    .footer-socials{display:flex;gap:10px;margin-top:16px}
    .footer-socials a{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid rgba(255,255,255,.18);padding:0;color:rgba(255,255,255,.8)}
    .footer-socials a:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .footer-socials svg{width:16px;height:16px}
    .footer-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.85rem}
    .footer-bottom .reg{color:rgba(255,255,255,.55)}

    #toTop{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;background:var(--deep);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transform:translateY(10px);transition:.25s;z-index:40}
    #toTop.show{opacity:1;visibility:visible;transform:translateY(0)}
    #toTop svg{width:20px;height:20px}
    .reveal{opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}
    .reveal.in{opacity:1;transform:none}

    @media(max-width:1024px){
      .adv-grid,.disc-grid,.market-grid{grid-template-columns:1fr 1fr}
      .hero-grid,.story-grid,.model-grid{grid-template-columns:1fr}
      .hero-note{border-left:0;border-top:1px solid rgba(255,255,255,.28);padding-left:0;padding-top:20px;max-width:48ch}
      .story-copy h2{max-width:18ch}.story-media{max-width:720px}.story-media img{aspect-ratio:16/10}.story-badge{right:18px}
      .model-copy{position:static}.section-head{grid-template-columns:1fr;gap:14px}.section-head h2{max-width:18ch}
      .footer-grid{grid-template-columns:1fr 1fr}
    }
    @media(max-width:860px){
      .main-nav,.header-right .socials{display:none}.nav-toggle{display:flex}
      .main-nav.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:1px solid var(--hairline);padding:12px var(--pad);gap:0;box-shadow:var(--shadow-lg)}
      .main-nav.open .nav-item{width:100%}.main-nav.open .dropdown{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:none;padding-left:12px}
      .stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0;border-top:1px solid var(--hairline)}.stat:nth-child(4){border-top:1px solid var(--hairline)}
      .hero{min-height:auto}.hero-inner{padding-top:90px;padding-bottom:92px}
    }
    @media(max-width:640px){
      .section{padding:68px 0}.adv-grid,.disc-grid,.market-grid,.footer-grid,.form-row{grid-template-columns:1fr}
      .stats{grid-template-columns:1fr}.stat+.stat,.stat:nth-child(3),.stat:nth-child(4){border-left:0;border-top:1px solid var(--hairline)}
      .stats-wrap{margin-top:-30px}.hero-inner{padding-top:72px;padding-bottom:76px}.hero-grid{gap:38px}
      .story-badge{position:static;margin:-32px 18px 0;max-width:none}.story-media img{aspect-ratio:4/5}
      .disc{min-height:auto}.step{grid-template-columns:52px 1fr;gap:14px}
    }
    @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}.adv-media img{transition:none}.btn{transition:none}}
  </style>
</head>
<body>
  <header id="header">
    <div class="wrap nav-bar">
      <a class="brand" href="https://www.base-4.com/" aria-label="BASE4 home"><img src="https://ohshtnvm.github.io/innolab-rebuild/6-29-iteration/logos/base4-logo.png" alt="BASE4"></a>
      <nav class="main-nav" id="mainNav"></nav>
      <div class="header-right">
        <div class="socials" id="headerSocials"></div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation"><span></span></button>
      </div>
    </div>
  </header>

  <main id="app"><div class="wrap" style="padding:120px 0;text-align:center;color:var(--muted)">Loading...</div></main>
  <footer id="footer"></footer>

  <button id="toTop" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

  <div class="modal" id="consultModal" role="dialog" aria-modal="true" aria-labelledby="consultTitle">
    <div class="modal-card">
      <button class="modal-close" id="consultClose" aria-label="Close">&times;</button>
      <h3 id="consultTitle"></h3>
      <p class="sub" id="consultSub"></p>
      <form id="leadForm">
        <input type="text" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
        <div class="form-row">
          <div class="field"><label id="nameLabel"></label><input name="name" required></div>
          <div class="field"><label id="companyLabel"></label><input name="company"></div>
        </div>
        <div class="field"><label id="emailLabel"></label><input type="email" name="email" required></div>
        <div class="form-row">

    function parseTSV(text){
      text.split('# SHEET: ').map(b=>b.trim()).filter(Boolean).forEach(block=>{
        const lines = block.split(/\r?\n/).filter(l=>l.length && !l.startsWith('#'));
        if(!lines.length) return;
        const sheetName = lines.shift().trim();
        const headers = lines.shift().split('\t').map(h=>h.trim());
        db[sheetName] = lines.map(line=>{
          const vals = line.split('\t');
          const row = {};
          headers.forEach((h,i)=>row[h]=(vals[i]||'').trim());
          return row;
        });
      });
    }
    const sheet = n => db[n] || [];
    const kv = n => { const out={}; sheet(n).forEach(r=>{ if(r.Parameter) out[r.Parameter]=r.Value; }); return out; };
    function track(event,params){try{gtag('event',event,params||{});}catch(e){}}

    function buildForm(){
      const f=kv('Form'),site=kv('Site');
      document.getElementById('consultTitle').textContent=f.Title;

      document.getElementById('messageLabel').textContent=f['Message Label'];

    function openConsult(){const m=document.getElementById('consultModal');m.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>{const f=m.querySelector('input[name="name"]');if(f)f.focus();},60);track('consult_open',{});}
    function closeConsult(){document.getElementById('consultModal').classList.remove('open');document.body.style.overflow='';}

    function wireGlobal(){
      const header=document.getElementById('header');
      const onScroll=()=>{header.classList.toggle('scrolled',window.scrollY>10);document.getElementById('toTop').classList.toggle('show',window.scrollY>600);};
      window.addEventListener('scroll',onScroll,{passive:true});onScroll();
      document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
      document.getElementById('navToggle').addEventListener('click',()=>document.getElementById('mainNav').classList.toggle('open'));
      document.body.addEventListener('click',e=>{const t=e.target.closest('[data-consult]');if(t){e.preventDefault();openConsult();}});
      document.getElementById('consultClose').addEventListener('click',closeConsult);
      document.getElementById('consultModal').addEventListener('click',e=>{if(e.target.id==='consultModal')closeConsult();});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')closeConsult();});
      document.body.addEventListener('click',e=>{const a=e.target.closest('[data-ev]');if(a)track(a.dataset.ev,{label:a.textContent.trim()});});

      const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}}),{threshold:.10});
      document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

      const form=document.getElementById('leadForm');
      form.addEventListener('submit',async e=>{
        e.preventDefault();
        const d=Object.fromEntries(new FormData(form).entries()),site=kv('Site'),status=document.getElementById('formStatus');
        if(d.company_website)return;
        track('generate_lead',{product:d.product||'',has_company:!!d.company});
        if(FORM_ENDPOINT){
          try{
            const r=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...d,source:site['Lead Source']})});
            if(!r.ok)throw new Error();
            status.textContent='Thanks. Your request was sent. We will be in touch shortly.';
          }catch(_){status.textContent='Something went wrong. Please email '+site.Email+'.';}
        }else{
          const body=`Name: ${d.name}\nCompany: ${d.company||''}\nEmail: ${d.email}\nLocation: ${d.location||''}\nProject type: ${d.product||''}\n\n${d.message||''}`;
          window.location.href=`mailto:${site.Email}?subject=${encodeURIComponent(site['Mailto Subject'])}&body=${encodeURIComponent(body)}`;
          status.textContent='Opening your email client to send the request...';
        }
        status.hidden=false;
      });

      const news=document.getElementById('newsForm');
      news.addEventListener('submit',e=>{e.preventDefault();const site=kv('Site'),email=new FormData(news).get('news_email');track('newsletter_signup',{});window.location.href=`mailto:${site.Email}?subject=${encodeURIComponent('Newsletter signup')}&body=${encodeURIComponent('Please add this address to the BASE4 newsletter: '+email)}`;const s=document.getElementById('newsStatus');s.textContent='Thanks. Confirm in your email client.';s.hidden=false;});
      wireEmbed();
    }

    function wireEmbed(){
      if(window.self===window.top)return;
      document.documentElement.classList.add('is-embedded');
      const postHeight=()=>{const h=Math.ceil(document.documentElement.scrollHeight);try{window.parent.postMessage({type:'base4-embed-height',height:h},'*');}catch(e){}};
      window.addEventListener('load',postHeight);window.addEventListener('resize',postHeight);
      if('ResizeObserver' in window)new ResizeObserver(postHeight).observe(document.body);
      document.addEventListener('click',()=>setTimeout(postHeight,80));setTimeout(postHeight,400);setTimeout(postHeight,1500);postHeight();
      let vp=null;
      const placeOverlays=()=>{if(!vp)return;document.querySelectorAll('.modal.open').forEach(o=>{o.style.top=vp.top+'px';o.style.height=vp.height+'px';o.style.bottom='auto';});};
      window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='base4-embed-viewport'&&typeof d.top==='number'){vp={top:d.top,height:d.height};placeOverlays();}});
      const requestViewport=()=>{try{window.parent.postMessage({type:'base4-embed-request-viewport'},'*');}catch(e){}};
      const overlayObserver=new MutationObserver(()=>{requestViewport();placeOverlays();});
      document.querySelectorAll('.modal').forEach(o=>overlayObserver.observe(o,{attributes:true,attributeFilter:['class']}));requestViewport();
      document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute('href').slice(1);if(!id)return;const target=document.getElementById(id);if(!target)return;e.preventDefault();const top=target.getBoundingClientRect().top+(window.scrollY||window.pageYOffset||0);try{window.parent.postMessage({type:'base4-embed-scroll',top},'*');}catch(err){}});
    }

    document.addEventListener('DOMContentLoaded',boot);
  </script>
</body>
</html>
