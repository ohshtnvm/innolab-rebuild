  <style>
    :root{
      --accent:#8dc63f;
      --accent-ink:#0E1A14;
      --ink:#0E1A14;
      --deep:#1C3A2E;
      --surface:#FFFFFF;
      --surface-alt:#F5F7F4;
      --hairline:#E3E8E1;
      --muted:#5b6b61;
      --max:1200px;
      --pad:24px;
      --radius:16px;
      --shadow:0 1px 2px rgba(14,26,20,.04), 0 8px 24px rgba(14,26,20,.06);
      --shadow-lg:0 12px 40px rgba(14,26,20,.16);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      font-size:1.0625rem;
      line-height:1.6;
      color:var(--ink);
      background:var(--surface);
      -webkit-font-smoothing:antialiased;
    }
    h1,h2,h3,h4,.display{font-family:'Inter Tight','Inter',sans-serif;line-height:1.12;letter-spacing:-.01em;font-weight:700}
    h1{font-size:clamp(2.5rem,5vw,4rem);margin:0 0 .5em}
    h2{font-size:clamp(1.7rem,3vw,2.1rem);margin:0 0 .5em}
    h3{font-size:1.2rem;margin:0 0 .4em}
    p{margin:0 0 1em}
    img{max-width:100%;display:block}
    a{color:inherit}
    .tnum{font-variant-numeric:tabular-nums}

    .wrap{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
    .section{padding:88px 0}
    .section--alt{background:var(--surface-alt)}
    .eyebrow{font-family:'Inter Tight';font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--deep);margin:0 0 18px}
    .eyebrow .dot{color:var(--accent)}
    .lead{font-size:1.18rem;color:var(--muted);max-width:62ch}
    .center{text-align:center;margin-left:auto;margin-right:auto}

    /* Buttons */
    .btn{
      display:inline-flex;align-items:center;gap:.5em;
      font-family:'Inter Tight';font-weight:700;font-size:1rem;
      padding:15px 26px;border-radius:999px;border:2px solid transparent;
      text-decoration:none;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
    }
    .btn:hover{transform:translateY(-2px)}
    .btn--primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(141,198,63,.35)}
    .btn--primary:hover{box-shadow:0 10px 26px rgba(141,198,63,.45)}
    .btn--ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
    .btn--ghost:hover{border-color:#fff;background:rgba(255,255,255,.08)}
    .btn--dark{background:var(--deep);color:#fff}
    .btn--outline{background:transparent;color:var(--deep);border-color:var(--hairline)}
    .btn--outline:hover{border-color:var(--deep)}

    /* ===================== HEADER ===================== */
    header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid transparent;transition:padding .2s ease,border-color .2s ease,box-shadow .2s ease}
    header.scrolled{border-color:var(--hairline);box-shadow:0 1px 0 rgba(14,26,20,.04)}
    .nav-bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 0;transition:padding .2s ease}
    header.scrolled .nav-bar{padding:9px 0}
    .brand{display:flex;align-items:center;text-decoration:none}
    .brand img{height:32px;width:auto;display:block}
    header.scrolled .brand img{height:28px}
    .main-nav{display:flex;align-items:center;gap:4px}
    .nav-item{position:relative}
    .nav-link{display:inline-flex;align-items:center;gap:5px;padding:10px 12px;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink);border-radius:8px}
    .nav-link:hover{background:var(--surface-alt)}
    .nav-item .caret{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-3px;transition:transform .2s}
    .dropdown{position:absolute;top:100%;left:0;min-width:230px;background:#fff;border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;opacity:0;visibility:hidden;transform:translateY(6px);transition:all .18s ease}
    .nav-item:hover .dropdown{opacity:1;visibility:visible;transform:translateY(4px)}
    .nav-item:hover .caret{transform:rotate(225deg);margin-top:2px}
    .dropdown a{display:block;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem;font-weight:500}
    .dropdown a:hover{background:var(--surface-alt);color:var(--deep)}
    .header-right{display:flex;align-items:center;gap:14px}
    .socials{display:flex;gap:8px}
    .socials a{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--deep);border:1px solid var(--hairline);transition:.15s}
    .socials a:hover{background:var(--deep);color:#fff;border-color:var(--deep)}
    .socials svg{width:16px;height:16px}
    .nav-toggle{display:none;background:none;border:1px solid var(--hairline);border-radius:8px;width:42px;height:42px;cursor:pointer;align-items:center;justify-content:center}
    .nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{content:'';display:block;width:18px;height:2px;background:var(--ink);position:relative;transition:.2s}
    .nav-toggle span::before{position:absolute;top:-6px}
    .nav-toggle span::after{position:absolute;top:6px}

    /* ===================== HERO (video bg + value-prop + stats) ===================== */
    .hero{position:relative;color:#fff;overflow:hidden;isolation:isolate;background:var(--deep)}
    .hero-bg{position:absolute;inset:0;z-index:-2;background:var(--deep) center/cover no-repeat}
    .hero-bg video{width:100%;height:100%;object-fit:cover}
    .hero::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,rgba(14,26,20,.92) 0%,rgba(28,58,46,.82) 46%,rgba(28,58,46,.55) 100%)}
    .hero-inner{padding-top:112px;padding-bottom:100px}
    .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:52px;align-items:center}
    .hero-copy{max-width:60ch}
    .hero h1{color:#fff}
    .hero .eyebrow{color:rgba(255,255,255,.82)}
    .hero p.sub{font-size:1.18rem;color:rgba(255,255,255,.9);max-width:56ch;margin-bottom:30px}
    .hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:28px}
    .trust-row{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;font-size:.88rem;color:rgba(255,255,255,.78);font-weight:500}
    .trust-row .sep{color:var(--accent)}
    .hero-stats .stat-foot{color:rgba(255,255,255,.72)}
    @media(prefers-reduced-motion:reduce){
      .hero-bg video{display:none}
      .hero-bg{background-image:url('https://ohshtnvm.github.io/innolab-rebuild/6-29-iteration/base4-hero-poster.jpg')}
    }
    @media(max-width:900px){
      .hero-grid{grid-template-columns:1fr;gap:34px}
      .hero-inner{padding-top:84px;padding-bottom:72px}
    }

    /* ===================== VALUE STRIP ===================== */
    .valueprop{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
    .stat-tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
    .stat-tile{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:24px 18px;text-align:center;box-shadow:var(--shadow)}
    .stat-tile .num{font-family:'Inter Tight';font-weight:800;font-size:2.1rem;color:var(--deep);line-height:1}
    .stat-tile .lbl{display:block;margin-top:8px;font-size:.82rem;color:var(--muted);font-weight:600}
    .stat-foot{grid-column:1/-1;font-size:.78rem;color:var(--muted);text-align:center;margin-top:4px}

    /* ===================== BRAND CAROUSEL (rotation) ===================== */
    .logo-marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
    .logo-track{display:flex;gap:72px;align-items:center;width:max-content;animation:marquee 30s linear infinite}
    .logo-marquee:hover .logo-track{animation-play-state:paused}
    .logo-track img{height:42px;width:auto;max-width:160px;object-fit:contain;opacity:.6;filter:grayscale(1);transition:opacity .2s, filter .2s}
    .logo-track img:hover{opacity:1;filter:none}
    @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    @media(prefers-reduced-motion:reduce){
      .logo-track{animation:none;flex-wrap:wrap;justify-content:center;width:auto;gap:48px}
    }

    /* ===================== CARDS ===================== */
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
    .card{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
    .card .ico{width:46px;height:46px;border-radius:12px;background:rgba(141,198,63,.16);display:grid;place-items:center;margin-bottom:18px;color:var(--deep)}
    .card .ico svg{width:24px;height:24px}
    .priority-tag{font-family:'Inter Tight';font-weight:700;color:var(--deep);font-size:1.05rem;margin-bottom:6px}
    .answer{color:var(--muted);font-size:.98rem;margin:0}
    .diff-claim{font-family:'Inter Tight';font-weight:700;font-size:1.15rem;margin-bottom:6px}

    /* WHY-CHOOSE-US two-column */
    .diff-grid{display:grid;grid-template-columns:.92fr 1.3fr;gap:48px;align-items:start}
    .diff-intro h2{font-size:clamp(1.7rem,3vw,2.3rem)}
    /* USP cards with image banners */
    .usp-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
    .usp-img{display:block;aspect-ratio:16/10;overflow:hidden;background:var(--surface-alt)}
    .usp-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
    .usp-card:hover .usp-img img{transform:scale(1.04)}
    .usp-body{padding:22px 24px 24px}
    .usp-link{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-family:'Inter Tight';font-weight:700;font-size:.86rem;color:var(--deep);text-decoration:none}
    .usp-link .arw{transition:transform .2s}
    .usp-link:hover .arw{transform:translateX(4px)}

    /* ===================== PROCESS TIMELINE ===================== */
    .timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:step}
    .step{position:relative;padding-top:42px}
    .step::before{counter-increment:step;content:counter(step);position:absolute;top:0;left:0;width:38px;height:38px;border-radius:50%;background:var(--deep);color:#fff;font-family:'Inter Tight';font-weight:800;display:grid;place-items:center}
    .step::after{content:'';position:absolute;top:18px;left:46px;right:-10px;height:2px;background:var(--hairline)}
    .step:last-child::after{display:none}
    .step h3{margin-bottom:6px}
    .step p{color:var(--muted);font-size:.95rem;margin:0}

    /* ===================== GALLERY ===================== */
    .portfolio-tools{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:24px 0 30px}
    .portfolio-tools .filters{margin:0}
    .sort-wrap{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);font-weight:600}
    .sort-wrap select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--hairline);border-radius:999px;padding:9px 34px 9px 14px;cursor:pointer}
    .more-projects-label{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:18px 0 2px;font-family:'Inter Tight';font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--deep)}
    .more-projects-label::after{content:'';height:1px;background:var(--hairline);flex:1}
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 30px}
    .filter{font-family:'Inter Tight';font-weight:600;font-size:.92rem;padding:9px 18px;border-radius:999px;border:1px solid var(--hairline);background:#fff;cursor:pointer;transition:.15s;color:var(--ink)}
    .filter:hover{border-color:var(--deep)}
    .filter.active{background:var(--deep);color:#fff;border-color:var(--deep)}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    .pcard{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .2s ease, box-shadow .2s ease;cursor:pointer;display:flex;flex-direction:column}
    .pcard:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
    .pcard .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface-alt)}
    .pcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
    .pcard:hover .ph img{transform:scale(1.05)}
    .flag-tag{position:absolute;top:12px;left:12px;background:rgba(14,26,20,.82);color:#fff;font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:999px;backdrop-filter:blur(4px)}
    .pcard .body{padding:20px 22px 24px;flex:1;display:flex;flex-direction:column}
    .pcard h3{margin-bottom:4px}
    .pcard .loc{color:var(--muted);font-size:.92rem;margin-bottom:14px}
    .pcard .meta-row{display:flex;gap:18px;font-size:.88rem;color:var(--ink);border-top:1px solid var(--hairline);padding-top:14px}
    .pcard .meta-row b{font-family:'Inter Tight';font-weight:800;color:var(--deep)}
    .pcard .view{margin-top:14px;font-family:'Inter Tight';font-weight:700;font-size:.86rem;color:var(--deep);display:inline-flex;align-items:center;gap:6px}
    .pcard:hover .view{color:var(--accent-ink)}
    .pcard .view .arw{transition:transform .2s}
    .pcard:hover .view .arw{transform:translateX(4px)}
    .callout{display:inline-block;margin-top:12px;font-size:.8rem;font-weight:600;color:var(--deep);background:rgba(141,198,63,.16);padding:4px 10px;border-radius:6px}

    /* ===================== RENDER → REALITY (carousel) ===================== */
    .rvr-marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
    .rvr-track{display:flex;width:max-content;padding:8px 0;animation:marquee 70s linear infinite}
    .rvr-marquee:hover .rvr-track{animation-play-state:paused}
    .rvr-item{flex:0 0 auto;width:min(360px,78vw);margin:0 20px 0 0;position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;background:var(--surface-alt);aspect-ratio:1/1}
    .rvr-item img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
    .rvr-item:hover img{transform:scale(1.04)}
    .rvr-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:26px 16px 14px;color:#fff;font-family:'Inter Tight';font-weight:600;font-size:.98rem;background:linear-gradient(180deg,transparent,rgba(14,26,20,.82))}
    @media(prefers-reduced-motion:reduce){.rvr-track{animation:none}.rvr-marquee{overflow-x:auto}}

    /* ===================== PROOF BAND ===================== */
    .proof{background:var(--deep);color:#fff}
    .proof .eyebrow{color:rgba(255,255,255,.7)}
    .proof-quotes{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .quote{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:30px}
    .quote p.q{font-size:1.12rem;font-style:italic;color:#fff}
    .quote .who{font-style:normal;font-weight:700;color:var(--accent);margin:0;font-size:.95rem}
    .quote .role{font-style:normal;color:rgba(255,255,255,.6);font-size:.82rem;margin:2px 0 0}
    .proof-note{font-size:.8rem;color:rgba(255,255,255,.55);text-align:center;margin:22px 0 0}
    .proof-logos{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
    .proof-logos .chip{background:#fff;border-radius:var(--radius);padding:22px;display:grid;place-items:center}
    .proof-logos .chip img{height:34px;width:auto;max-width:130px;object-fit:contain}

    /* ===================== CLOSING CTA BAND ===================== */
    .closing{position:relative;color:#fff;text-align:center;overflow:hidden;isolation:isolate}
    .closing-bg{position:absolute;inset:0;z-index:-2;background:var(--deep) center/cover no-repeat}
    .closing::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,26,20,.82),rgba(28,58,46,.86))}
    .closing .inner{padding:96px 0;max-width:60ch;margin:0 auto}
    .closing h2{color:#fff;font-size:clamp(1.8rem,3.4vw,2.5rem)}
    .closing p{color:rgba(255,255,255,.86)}

    /* ===================== MODAL (consultation) ===================== */
    .modal{position:fixed;inset:0;background:rgba(10,18,14,.78);backdrop-filter:blur(4px);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
    .modal.open{display:flex}
    /* Embed (iframe) mode: overlays are position:fixed, which pins them to the top of the
       tall auto-height iframe. When embedded we switch to absolute; wireEmbed() then places
       them over the parent's visible viewport so they open where the visitor is looking. */
    html.is-embedded .modal,html.is-embedded .lb{position:absolute}
    html.is-embedded #toTop{display:none}
    /* Use WordPress's built-in header/footer: hide THIS page's own header + footer
       when it runs inside the iframe embed, so they don't duplicate the theme's
       nav/footer. Standalone/direct view keeps them. To always hide them (e.g. when
       pasting the body into a WP template that already has chrome), delete the two
       "html.is-embedded " prefixes below. To keep the page's own nav/footer in the
       embed instead, delete these two rules. */
    html.is-embedded #header{display:none}
    html.is-embedded #footer{display:none}
    .modal-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);max-width:560px;width:100%;padding:30px;position:relative}
    .modal-card h3{color:var(--ink);margin-bottom:4px;font-size:1.4rem}
    .modal-card .sub{color:var(--muted);font-size:.95rem;margin-bottom:18px}
    .modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:var(--surface-alt);border:none;color:var(--ink);font-size:1.3rem;cursor:pointer;line-height:1}
    .modal-close:hover{background:var(--hairline)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--hairline);border-radius:10px;font:inherit;font-size:.95rem;color:var(--ink);background:#fff}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(141,198,63,.25)}
    .form-foot{display:flex;flex-direction:column;gap:10px;margin-top:4px}
    .mailto-fallback{font-size:.85rem;color:var(--muted)}
    .mailto-fallback a{color:var(--deep);font-weight:600}
    .form-status{margin:12px 0 0;font-size:.9rem;font-weight:600;color:var(--deep)}

    /* ===================== FOOTER ===================== */
    footer{background:var(--ink);color:rgba(255,255,255,.72);padding:64px 0 32px}
    .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.4fr;gap:36px;margin-bottom:44px}
    footer h4{color:#fff;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
    footer a{color:rgba(255,255,255,.72);text-decoration:none;display:block;padding:5px 0;font-size:.93rem}
    footer a:hover{color:var(--accent)}
    .footer-brand .brand-txt{font-family:'Inter Tight';font-weight:800;font-size:1.4rem;color:#fff;letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
    .footer-brand .brand-txt .mark{width:12px;height:12px;border-radius:3px;background:var(--accent)}
    .footer-brand .brand-logo img{height:30px;width:auto;filter:brightness(0) invert(1)}
    .footer-brand p{font-size:.92rem;margin-top:14px;max-width:34ch}
    .news-form{display:flex;gap:8px;margin-top:12px}
    .news-form input{flex:1;padding:11px 13px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);border-radius:10px;color:#fff;font:inherit;font-size:.9rem}
    .news-form input::placeholder{color:rgba(255,255,255,.45)}
    .news-form button{border:none;background:var(--accent);color:var(--accent-ink);font-family:'Inter Tight';font-weight:700;border-radius:10px;padding:0 16px;cursor:pointer}
    .footer-socials{display:flex;gap:10px;margin-top:16px}
    .footer-socials a{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid rgba(255,255,255,.18);padding:0;color:rgba(255,255,255,.8)}
    .footer-socials a:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .footer-socials svg{width:16px;height:16px}
    .footer-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.85rem}
    .footer-bottom .reg{color:rgba(255,255,255,.55)}

    /* ===================== BACK TO TOP ===================== */
    #toTop{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;background:var(--deep);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transform:translateY(10px);transition:.25s;z-index:40}
    #toTop.show{opacity:1;visibility:visible;transform:translateY(0)}
    #toTop svg{width:20px;height:20px}

    /* ===================== LIGHTBOX ===================== */
    .lb{position:fixed;inset:0;background:rgba(10,18,14,.92);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
    .lb.open{display:flex}
    .lb-inner{max-width:1000px;width:100%}
    .lb-head{display:flex;justify-content:space-between;align-items:flex-end;color:#fff;margin-bottom:14px;gap:16px}
    .lb-head h3{color:#fff;margin:0}
    .lb-head p{margin:0;color:rgba(255,255,255,.7);font-size:.9rem}
    .lb-stage img{width:100%;max-height:64vh;object-fit:contain;border-radius:12px;background:#000}
    .lb-thumbs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
    .lb-thumbs img{height:62px;width:84px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.55;border:2px solid transparent}
    .lb-thumbs img.active{opacity:1;border-color:var(--accent)}
    .lb-close{position:absolute;top:18px;right:22px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:1.4rem;cursor:pointer}
    .lb-actions{margin-top:16px}

    /* ===================== REVEAL ===================== */
    .reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease, transform .5s ease}
    .reveal.in{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}

    /* ===================== RESPONSIVE ===================== */
    @media(max-width:1024px){
      .grid-4,.timeline{grid-template-columns:1fr 1fr}
      .gallery{grid-template-columns:1fr 1fr}
      .diff-grid{grid-template-columns:1fr;gap:32px}
      .proof-logos{grid-template-columns:repeat(3,1fr)}
      .step::after{display:none}
    }
    @media(max-width:860px){
      .main-nav,.header-right .socials{display:none}
      .nav-toggle{display:flex}
      .main-nav.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:1px solid var(--hairline);padding:12px var(--pad);gap:0;box-shadow:var(--shadow-lg)}
      .main-nav.open .nav-item{width:100%}
      .main-nav.open .dropdown{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:none;padding-left:12px}
      .valueprop,.convert-grid{grid-template-columns:1fr}
      .grid-2,.stat-tiles{grid-template-columns:1fr}
      .proof-quotes{grid-template-columns:1fr}
      .footer-grid{grid-template-columns:1fr 1fr}
      .hero-inner{padding-top:88px;padding-bottom:76px}
    }
    @media(max-width:560px){
      .grid-4,.timeline,.gallery,.footer-grid,.form-row,.proof-logos{grid-template-columns:1fr}
      .section{padding:60px 0}
    }
  </style>

    function parseTSV(text){

    function buildRvr(){
      const items = sheet('RenderReality').filter(r=>r.file);

        </figure>`;
      // duplicate the set so the marquee loops seamlessly

    /* ---------- gallery + filters ---------- */
    const FILTERS = ['All','Hyatt','Marriott','Hilton','IHG','Choice','Wyndham','Other'];
    function buildGallery(){
      const fc = document.getElementById('filters');
      const grid = document.getElementById('gallery');
      const sortEl = document.getElementById('projectSort');
      const seeAll = document.getElementById('seeAllProjects');
      const projects = sheet('Projects');
      let activeFilter = 'All';
      let expanded = false;

      fc.innerHTML = FILTERS.map((f,i)=>`<button class="filter${i===0?' active':''}" data-f="${f}">${f}</button>`).join('');

      const yearNum = p => /^\d{4}$/.test(p.year||'') ? Number(p.year) : null;
      const sourceOrder = p => Number(p.catalog_order)||9999;
      const sortList = (list, mode) => [...list].sort((a,b)=>{
        if(mode==='az') return a.name.localeCompare(b.name);
        if(mode==='za') return b.name.localeCompare(a.name);
        if(mode==='newest' || mode==='oldest'){
          const ay=yearNum(a), by=yearNum(b);
          if(ay===null && by===null) return sourceOrder(a)-sourceOrder(b) || a.name.localeCompare(b.name);
          if(ay===null) return 1;
          if(by===null) return -1;
          return mode==='newest' ? (by-ay || sourceOrder(a)-sourceOrder(b)) : (ay-by || sourceOrder(a)-sourceOrder(b));
        }
        const ao=Number(a.featured_order)||999, bo=Number(b.featured_order)||999;
        return ao-bo || sourceOrder(a)-sourceOrder(b) || a.name.localeCompare(b.name);
      });

      const card = (p,idx)=>{
        const eager = idx<3 ? 'eager' : 'lazy';
        const fp = idx<3 ? ' fetchpriority="high"' : '';
        const img = p.primary_image || asset('base4-hero-poster.jpg');
        const locBits = [];
        if(p.location && p.location!=='—') locBits.push(esc(p.location));
        if(p.type && p.type!=='—') locBits.push(esc(p.type));
        return `
          <article class="pcard reveal in" data-project="${esc(p.name)}" data-url="${p.url||''}">
            <div class="ph"><span class="flag-tag">${esc(p.franchise||'Other')}</span><img src="${img}" alt="${esc(p.name)}" loading="${eager}"${fp}></div>
            <div class="body">
              <h3>${esc(p.name)}</h3>
              <div class="loc">${locBits.join(' · ') || 'Hospitality'}</div>
              <div class="meta-row">
                ${p.keys && p.keys!=='—' ? `<span><b class="tnum">${esc(p.keys)}</b> keys</span>`:''}
                ${p.stories && p.stories!=='—' ? `<span><b class="tnum">${esc(p.stories)}</b> stories</span>`:''}
                ${p.year && p.year!=='—' ? `<span><b class="tnum">${esc(p.year)}</b></span>`:''}
              </div>
              ${p.note ? `<span class="callout">${esc(p.note)}</span>`:''}
              <span class="view">View project <span class="arw">→</span></span>
            </div>
          </article>`;
      };

      function render(){
        const filtered = projects.filter(p=>activeFilter==='All' || p.franchise===activeFilter);
        const featured = sortList(filtered.filter(p=>p.featured==='1'), sortEl.value);
        const more = sortList(filtered.filter(p=>p.featured!=='1'), sortEl.value);
        let html = featured.map(card).join('');
        if(expanded && more.length){
          html += `<div class="more-projects-label">More hospitality projects</div>` + more.map((p,i)=>card(p,featured.length+i)).join('');
        }
        if(!html) html = `<p style="color:var(--muted)">${expanded ? 'No projects in this category yet.' : 'No featured projects in this category. Select See All Hospitality Projects to view the full catalog.'}</p>`;
        grid.innerHTML = html;
        seeAll.textContent = expanded ? 'Show Featured Projects ↑' : 'See All Hospitality Projects →';
        seeAll.setAttribute('aria-expanded', String(expanded));
        seeAll.hidden = !more.length && !expanded;
      }

      render();
      fc.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{
        fc.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.f;
        render();
        track('project_filter',{filter:activeFilter,expanded});
      }));
      sortEl.addEventListener('change',()=>{
        render();
        track('project_sort',{sort:sortEl.value,expanded});
      });
      seeAll.addEventListener('click',()=>{
        expanded = !expanded;
        render();
        track(expanded?'see_all_projects':'show_featured_projects',{filter:activeFilter,sort:sortEl.value});
        if(expanded){
          const moreLabel = grid.querySelector('.more-projects-label');
          if(moreLabel) moreLabel.scrollIntoView({behavior:'smooth',block:'nearest'});
        }
      });
      grid.addEventListener('click', e=>{
        const c = e.target.closest('.pcard');
        if(c) openLightbox(c.dataset.project, c.dataset.url);
      });
    }

      // reveal
      const io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){en.target.classList.add('in'); io.unobserve(en.target);} }),{threshold:.12});

    /* ---------- iframe embed height reporter (Route B) ----------
       Inert unless the page is loaded inside an iframe. Posts the content height to the
       parent so an auto-height embed can resize to fit. Parent listens for
       {type:'base4-embed-height', height:<px>}. See HANDOFF-IFRAME.md. */
    function wireEmbed(){
      if(window.self === window.top) return;            // not embedded — do nothing
      document.documentElement.classList.add('is-embedded');
      const postHeight = ()=>{
        const h = Math.ceil(document.documentElement.scrollHeight);
        try{ window.parent.postMessage({type:'base4-embed-height', height:h}, '*'); }catch(e){}
      };
      window.addEventListener('load', postHeight);
      window.addEventListener('resize', postHeight);
      if('ResizeObserver' in window){ new ResizeObserver(postHeight).observe(document.body); }
      document.addEventListener('click', ()=>setTimeout(postHeight, 80)); // filters, nav toggle, lightbox
      setTimeout(postHeight, 400); setTimeout(postHeight, 1500);          // catch late-loading images
      postHeight();

      /* Modal positioning: overlays (.modal, .lb) are position:fixed and would pin to the top
         of this tall iframe — off-screen for a visitor scrolled further down. The parent tells
         us which slice of the iframe is currently visible; we place any open overlay there. */
      let vp = null;
      const placeOverlays = ()=>{
        if(!vp) return;
        document.querySelectorAll('.modal.open, .lb.open').forEach(o=>{
          o.style.top = vp.top + 'px';
          o.style.height = vp.height + 'px';
          o.style.bottom = 'auto';
        });
      };
      window.addEventListener('message', e=>{
        const d = e.data || {};
        if(d.type === 'base4-embed-viewport' && typeof d.top === 'number'){
          vp = {top:d.top, height:d.height};
          placeOverlays();
        }
      });
      const requestViewport = ()=>{ try{ window.parent.postMessage({type:'base4-embed-request-viewport'}, '*'); }catch(e){} };
      // Reposition the moment an overlay opens (uses the cached viewport; also refreshes it).
      const overlayObserver = new MutationObserver(()=>{ requestViewport(); placeOverlays(); });
      document.querySelectorAll('.modal, .lb').forEach(o=> overlayObserver.observe(o, {attributes:true, attributeFilter:['class']}));
      requestViewport();

      /* In-page anchor links (e.g. "View Our Hospitality Work" -> #projects) can't scroll the
         iframe itself — it has no scrollbar, the parent does. Intercept them and ask the parent
         to scroll to the target's position within the iframe. */
      document.addEventListener('click', e=>{
        const a = e.target.closest('a[href^="#"]');
        if(!a) return;
        const id = a.getAttribute('href').slice(1);
        if(!id) return;
        const target = document.getElementById(id);
        if(!target) return;
        e.preventDefault();
        const top = target.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0);
        try{ window.parent.postMessage({type:'base4-embed-scroll', top:top}, '*'); }catch(err){}
      });
    }

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
