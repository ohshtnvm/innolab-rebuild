  <style>
    :root{
      --accent:#8dc63f;
      --accent-soft:#edf7df;
      --accent-ink:#0e1a14;
      --ink:#0e1a14;
      --deep:#1c3a2e;
      --deep-2:#11281f;
      --surface:#ffffff;
      --surface-alt:#f5f7f4;
      --hairline:#e3e8e1;
      --muted:#5b6b61;
      --max:1240px;
      --pad:24px;
      --radius:18px;
      --radius-lg:28px;
      --shadow:0 1px 2px rgba(14,26,20,.04),0 8px 24px rgba(14,26,20,.06);
      --shadow-lg:0 20px 60px rgba(14,26,20,.16);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:1.0625rem;line-height:1.6;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
    h1,h2,h3,h4,.display{font-family:'Inter Tight','Inter',sans-serif;line-height:1.06;letter-spacing:-.02em;font-weight:700}
    h1{font-size:clamp(3.15rem,6.5vw,6.1rem);margin:0 0 .3em}
    h2{font-size:clamp(2.15rem,4.2vw,3.65rem);margin:0 0 .42em}
    h3{font-size:1.28rem;margin:0 0 .45em}
    p{margin:0 0 1em}
    img{display:block;max-width:100%}
    a{color:inherit}
    button,input,select,textarea{font:inherit}
    .wrap{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
    .section{padding:104px 0}
    .section--alt{background:var(--surface-alt)}
    .eyebrow{font-family:'Inter Tight';font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem;color:var(--deep);margin:0 0 18px}
    .eyebrow .dot{color:var(--accent)}
    .lead{font-size:1.16rem;color:var(--muted);max-width:64ch}
    .center{text-align:center;margin-left:auto;margin-right:auto}
    .muted{color:var(--muted)}
    .tnum{font-variant-numeric:tabular-nums}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;font-family:'Inter Tight';font-weight:700;font-size:1rem;padding:15px 26px;border-radius:999px;border:2px solid transparent;text-decoration:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease,border-color .15s ease}
    .btn:hover{transform:translateY(-2px)}
    .btn--primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 7px 20px rgba(141,198,63,.32)}
    .btn--primary:hover{box-shadow:0 12px 30px rgba(141,198,63,.44)}
    .btn--ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.48)}
    .btn--ghost:hover{background:rgba(255,255,255,.08);border-color:#fff}
    .btn--dark{background:var(--deep);color:#fff}
    .btn--outline{background:transparent;color:var(--deep);border-color:var(--hairline)}
    .btn--outline:hover{border-color:var(--deep)}
    .text-link{display:inline-flex;align-items:center;gap:7px;font-family:'Inter Tight';font-weight:700;text-decoration:none;color:var(--deep)}
    .text-link .arr{transition:transform .2s}
    .text-link:hover .arr{transform:translateX(4px)}

    /* Header */
    header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s ease,box-shadow .2s ease}
    header.scrolled{border-color:var(--hairline);box-shadow:0 1px 0 rgba(14,26,20,.04)}
    .nav-bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 0;transition:padding .2s ease}
    header.scrolled .nav-bar{padding:9px 0}
    .brand{display:flex;align-items:center;text-decoration:none}
    .brand img{height:32px;width:auto;transition:height .2s ease}
    header.scrolled .brand img{height:28px}
    .main-nav{display:flex;align-items:center;gap:4px}
    .nav-item{position:relative}
    .nav-link{display:inline-flex;align-items:center;gap:5px;padding:10px 12px;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink);border-radius:8px}
    .nav-link:hover{background:var(--surface-alt)}
    .caret{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-3px;transition:transform .2s}
    .dropdown{position:absolute;top:100%;left:0;min-width:240px;background:#fff;border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;opacity:0;visibility:hidden;transform:translateY(6px);transition:all .18s ease}
    .nav-item:hover .dropdown{opacity:1;visibility:visible;transform:translateY(4px)}
    .nav-item:hover .caret{transform:rotate(225deg);margin-top:2px}
    .dropdown a{display:block;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem;font-weight:500}
    .dropdown a:hover{background:var(--surface-alt);color:var(--deep)}
    .header-right{display:flex;align-items:center;gap:14px}
    .socials{display:flex;gap:8px}
    .socials a{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--deep);border:1px solid var(--hairline);transition:.15s}
    .socials a:hover{background:var(--deep);color:#fff;border-color:var(--deep)}
    .socials svg{width:16px;height:16px}
    .nav-toggle{display:none;background:none;border:1px solid var(--hairline);border-radius:8px;width:42px;height:42px;cursor:pointer;align-items:center;justify-content:center}
    .nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{content:'';display:block;width:18px;height:2px;background:var(--ink);position:relative;transition:.2s}
    .nav-toggle span::before{position:absolute;top:-6px}.nav-toggle span::after{position:absolute;top:6px}

    /* Hero */
    .hero{position:relative;overflow:hidden;isolation:isolate;color:#fff;background:var(--deep)}
    .hero-bg{position:absolute;inset:0;z-index:-2;background:center/cover no-repeat;transform:scale(1.015)}
    .hero::after{content:'';position:absolute;inset:0;z-index:-1;background:
      linear-gradient(98deg,rgba(8,22,15,.97) 0%,rgba(18,46,34,.91) 43%,rgba(21,55,40,.62) 68%,rgba(21,55,40,.28) 100%)}
    .hero-inner{min-height:720px;padding:110px 0 125px;display:flex;align-items:center}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(320px,.62fr);gap:72px;align-items:end;width:100%}
    .hero-copy{max-width:820px}
    .hero .eyebrow{color:rgba(255,255,255,.76)}
    .hero h1{color:#fff;max-width:11.5ch}
    .hero p.sub{font-size:1.2rem;color:rgba(255,255,255,.88);max-width:60ch;margin-bottom:32px}
    .hero-cta{display:flex;gap:14px;flex-wrap:wrap}
    .hero-panel{align-self:end;background:rgba(9,28,19,.62);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:26px}
    .hero-panel .mini{font-family:'Inter Tight';font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
    .hero-panel h3{color:#fff;font-size:1.55rem;margin-bottom:16px}
    .hero-panel ul{list-style:none;padding:0;margin:0}
    .hero-panel li{display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.78);font-size:.93rem}
    .hero-panel li::before{content:'+';color:var(--accent);font-family:'Inter Tight';font-weight:800}

    /* Proof bar */
    .proof-wrap{position:relative;z-index:6;margin-top:-48px}
    .proof-bar{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--hairline);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg)}
    .proof-item{padding:28px 26px;min-height:128px;display:flex;flex-direction:column;justify-content:center}
    .proof-item+.proof-item{border-left:1px solid var(--hairline)}
    .proof-item .num{font-family:'Inter Tight';font-size:2.35rem;font-weight:800;line-height:1;color:var(--deep)}
    .proof-item .label{font-family:'Inter Tight';font-weight:700;font-size:.94rem;margin-top:9px}
    .proof-item .desc{font-size:.79rem;color:var(--muted);margin-top:4px}

    /* Section heading */
    .section-head{display:grid;grid-template-columns:.72fr 1.28fr;gap:58px;align-items:end;margin-bottom:46px}
    .section-head h2{margin:0;max-width:14ch}
    .section-head .lead{margin:0;max-width:58ch}
    .section-head--single{max-width:760px;margin-bottom:46px}

    /* Intro */
    .intro-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:72px;align-items:center}
    .intro-visual{position:relative}
    .intro-visual img{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:var(--radius-lg);box-shadow:var(--shadow)}
    .intro-note{position:absolute;right:-20px;bottom:24px;width:min(330px,78%);padding:22px 24px;background:var(--deep);color:#fff;border-radius:16px;box-shadow:var(--shadow-lg)}
    .intro-note strong{display:block;font-family:'Inter Tight';font-size:1.15rem;margin-bottom:5px}
    .intro-note span{font-size:.88rem;color:rgba(255,255,255,.68)}
    .intro-copy h2{max-width:12ch}
    .intro-copy .lead{margin-bottom:18px}
    .intro-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}

    /* Services */
    .services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .service-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow);min-height:330px;display:flex;flex-direction:column;position:relative;overflow:hidden}
    .service-card::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;right:-74px;bottom:-76px;background:var(--accent-soft)}
    .service-card .ico{width:48px;height:48px;display:grid;place-items:center;border-radius:13px;background:rgba(141,198,63,.16);color:var(--deep);margin-bottom:42px;position:relative;z-index:1}
    .service-card .ico svg{width:24px;height:24px}
    .service-card h3{font-size:1.7rem;position:relative;z-index:1}
    .service-card p{color:var(--muted);font-size:.96rem;position:relative;z-index:1}
    .service-card a{margin-top:auto;position:relative;z-index:1}

    /* Markets */
    .markets{background:var(--deep);color:#fff;overflow:hidden}
    .markets .eyebrow{color:rgba(255,255,255,.67)}
    .markets h2{color:#fff}
    .markets .lead{color:rgba(255,255,255,.70)}
    .market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .market-card{position:relative;min-height:470px;border-radius:var(--radius-lg);overflow:hidden;isolation:isolate;background:#153629;display:flex;align-items:flex-end}
    .market-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .5s ease}
    .market-card::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,25,18,.05),rgba(10,25,18,.92) 80%)}
    .market-card:hover img{transform:scale(1.045)}
    .market-body{padding:30px}
    .market-kicker{font-family:'Inter Tight';font-weight:800;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
    .market-card h3{font-size:2rem;color:#fff}
    .market-card p{color:rgba(255,255,255,.70);font-size:.94rem;max-width:31ch}
    .market-card a{color:#fff}

    /* How */
    .how-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:72px;align-items:start}
    .how-copy{position:sticky;top:112px}
    .how-copy h2{max-width:12ch}
    .steps{border-top:1px solid var(--hairline)}
    .step{display:grid;grid-template-columns:74px 1fr;gap:24px;padding:30px 0;border-bottom:1px solid var(--hairline)}
    .step-num{font-family:'Inter Tight';font-weight:800;color:var(--accent);font-size:.92rem}
    .step h3{font-size:1.4rem;margin-bottom:7px}
    .step p{color:var(--muted);font-size:.97rem;margin:0;max-width:62ch}

    /* Work */
    .work-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
    .project-card{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-alt);min-height:320px;isolation:isolate;box-shadow:var(--shadow)}
    .project-card:nth-child(1){grid-column:span 7;min-height:500px}
    .project-card:nth-child(2){grid-column:span 5;min-height:500px}
    .project-card:nth-child(n+3){grid-column:span 4}
    .project-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .45s ease}
    .project-card::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(8,22,15,.86))}
    .project-card:hover img{transform:scale(1.045)}
    .project-body{position:absolute;left:0;right:0;bottom:0;padding:28px;color:#fff}
    .project-type{font-family:'Inter Tight';font-size:.73rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
    .project-card h3{font-size:1.55rem;color:#fff;margin-bottom:4px}
    .project-card p{font-size:.89rem;color:rgba(255,255,255,.68);margin:0}
    .project-card a{position:absolute;inset:0;z-index:3;text-indent:-9999px}

    /* Innovation */
    .innovation{background:var(--surface-alt)}
    .innovation-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
    .innovation-main,.innovation-side{border-radius:var(--radius-lg);overflow:hidden;position:relative}
    .innovation-main{background:var(--deep);color:#fff;padding:46px;min-height:430px}
    .innovation-main .eyebrow{color:rgba(255,255,255,.65)}
    .innovation-main h2{color:#fff;max-width:13ch}
    .innovation-main p{color:rgba(255,255,255,.70);max-width:55ch}
    .innovation-points{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:34px 0}
    .innovation-point{padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:12px;font-family:'Inter Tight';font-size:.92rem;color:rgba(255,255,255,.84)}
    .innovation-side{background:#fff;border:1px solid var(--hairline);padding:36px;display:flex;flex-direction:column;justify-content:space-between}
    .innovation-side .tag{font-family:'Inter Tight';font-weight:800;color:var(--accent);letter-spacing:.12em;font-size:.74rem;text-transform:uppercase}
    .innovation-side h3{font-size:2rem;max-width:12ch;margin-top:18px}
    .innovation-side p{color:var(--muted)}

    /* Insights */
    .insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .insight{border:1px solid var(--hairline);border-radius:var(--radius);padding:28px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:310px}
    .insight-meta{display:flex;gap:12px;align-items:center;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:28px}
    .insight-meta .topic{color:var(--deep);background:var(--accent-soft);padding:4px 9px;border-radius:999px}
    .insight h3{font-size:1.55rem}
    .insight p{color:var(--muted);font-size:.94rem}
    .insight a{margin-top:auto}

    /* Recognition */
    .recognition{padding:74px 0;background:#fff;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
    .recognition-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:48px;align-items:center}
    .recognition h2{font-size:2rem;margin:0}
    .award-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .award{border:1px solid var(--hairline);border-radius:14px;min-height:96px;display:grid;place-items:center;text-align:center;padding:14px;font-family:'Inter Tight';font-weight:800;color:var(--deep);background:var(--surface-alt)}

    /* Newsletter */
    .newsletter{background:var(--deep-2);color:#fff}
    .newsletter-grid{display:grid;grid-template-columns:1fr .85fr;gap:72px;align-items:center}
    .newsletter .eyebrow{color:rgba(255,255,255,.62)}
    .newsletter h2{color:#fff;max-width:14ch}
    .newsletter p{color:rgba(255,255,255,.70);max-width:58ch}
    .newsbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:var(--radius-lg);padding:28px}
    .newsbox .big{font-family:'Inter Tight';font-weight:800;font-size:2.35rem;line-height:1;color:var(--accent)}
    .newsbox .label{font-family:'Inter Tight';font-weight:700;margin-top:8px}
    .newsletter-form{display:flex;gap:10px;margin-top:22px}
    .newsletter-form input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.06);padding:14px 17px;color:#fff}
    .newsletter-form input::placeholder{color:rgba(255,255,255,.46)}
    .newsletter-form button{border:0}

    /* Closing */
    .closing{position:relative;overflow:hidden;isolation:isolate;color:#fff;text-align:center}
    .closing-bg{position:absolute;inset:0;z-index:-2;background:center/cover no-repeat}
    .closing::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,26,18,.80),rgba(18,50,36,.93))}
    .closing .inner{padding:116px 0;max-width:780px;margin:0 auto}
    .closing .eyebrow{color:rgba(255,255,255,.65)}
    .closing h2{color:#fff}
    .closing p{color:rgba(255,255,255,.79);font-size:1.08rem}

    /* Modal */
    .modal{position:fixed;inset:0;background:rgba(10,18,14,.78);backdrop-filter:blur(4px);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
    .modal.open{display:flex}
    html.is-embedded .modal{position:absolute}
    html.is-embedded #toTop{display:none}
    html.is-embedded #header,html.is-embedded #footer{display:none}
    .modal-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);max-width:560px;width:100%;padding:30px;position:relative}
    .modal-card h3{color:var(--ink);margin-bottom:4px;font-size:1.45rem}
    .modal-card .sub{color:var(--muted);font-size:.95rem;margin-bottom:18px}
    .modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:var(--surface-alt);border:none;color:var(--ink);font-size:1.3rem;cursor:pointer;line-height:1}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--hairline);border-radius:10px;font:inherit;font-size:.95rem;color:var(--ink);background:#fff}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(141,198,63,.25)}
    .form-foot{display:flex;flex-direction:column;gap:10px;margin-top:4px}
    .mailto-fallback{font-size:.85rem;color:var(--muted)}
    .mailto-fallback a{color:var(--deep);font-weight:600}
    .form-status{margin:12px 0 0;font-size:.9rem;font-weight:600;color:var(--deep)}

    /* Footer */
    footer{background:var(--ink);color:rgba(255,255,255,.72);padding:64px 0 32px}
    .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.4fr;gap:36px;margin-bottom:44px}
    footer h4{color:#fff;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
    footer a{color:rgba(255,255,255,.72);text-decoration:none;display:block;padding:5px 0;font-size:.93rem}
    footer a:hover{color:var(--accent)}
    .footer-brand .brand-logo img{height:30px;width:auto;filter:brightness(0) invert(1)}
    .footer-brand p{font-size:.92rem;margin-top:14px;max-width:34ch}
    .footer-socials{display:flex;gap:10px;margin-top:16px}
    .footer-socials a{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid rgba(255,255,255,.18);padding:0;color:rgba(255,255,255,.8)}

          return row;
        });
      });

        <article class="insight reveal">

      const innovationPoints = (inn.Points||'').split('||').filter(Boolean).map(v=>`<div class="innovation-point">${esc(v)}</div>`).join('');

      document.getElementById('app').innerHTML = `

          <div class="wrap hero-inner">

          <div class="wrap"><div class="proof-bar">${proof}</div></div>
        </div>

        <section class="section">
          <div class="wrap intro-grid">
            <div class="intro-visual reveal">
              <img src="${esc(intro.Image)}" alt="Integrated BASE4 design services" loading="lazy">
              <div class="intro-note"><strong>${esc(intro['Note Title'])}</strong><span>${esc(intro['Note Body'])}</span></div>
            </div>
            <div class="intro-copy reveal">
              <div class="eyebrow"><span class="dot">●</span> ${esc(intro.Eyebrow)}</div>
              <h2>${esc(intro.Title)}</h2>
              <p class="lead">${esc(intro.Body)}</p>
              <p class="muted">${esc(intro['Body 2'])}</p>
              <div class="intro-actions">
                <a class="btn btn--dark" href="${esc(intro['Primary URL'])}">${esc(intro['Primary CTA'])}</a>
                <a class="btn btn--outline" href="${esc(intro['Secondary URL'])}">${esc(intro['Secondary CTA'])}</a>
              </div>
            </div>
          </div>
        </section>

        <section class="section section--alt">
          <div class="wrap">
            <div class="section-head">
              <div class="reveal">
                <div class="eyebrow"><span class="dot">●</span> ${esc(si.Eyebrow)}</div>
                <h2>${esc(si.Title)}</h2>
              </div>
              <p class="lead reveal">${esc(si.Body)}</p>
            </div>
            <div class="services-grid">${services}</div>
          </div>
        </section>

        <section class="section markets">
          <div class="wrap">
            <div class="section-head">
              <div class="reveal">
                <div class="eyebrow"><span class="dot">●</span> ${esc(mi.Eyebrow)}</div>
                <h2>${esc(mi.Title)}</h2>
              </div>
              <p class="lead reveal">${esc(mi.Body)}</p>
            </div>
            <div class="market-grid">${markets}</div>

        </section>

        <section class="section">
          <div class="wrap how-grid">

              <div class="eyebrow"><span class="dot">●</span> ${esc(hi.Eyebrow)}</div>
              <h2>${esc(hi.Title)}</h2>
              <p class="lead">${esc(hi.Body)}</p>
            </div>
            <div class="steps">${steps}</div>
          </div>
        </section>

        <section class="section section--alt">
          <div class="wrap">
            <div class="section-head">
              <div class="reveal">
                <div class="eyebrow"><span class="dot">●</span> ${esc(pi.Eyebrow)}</div>
                <h2>${esc(pi.Title)}</h2>
              </div>
              <div class="reveal">
                <p class="lead">${esc(pi.Body)}</p>
                <a class="text-link" href="https://www.base-4.com/projects/">View full portfolio <span class="arr">→</span></a>

        <section class="section innovation">
          <div class="wrap innovation-grid">

              <div class="innovation-points">${innovationPoints}</div>

            <div class="innovation-side reveal">

        <section class="section">

    function renderForm(){
      const f = kv('Form'), site = kv('Site');
      document.getElementById('consultTitle').textContent = f.Title || '';
      document.getElementById('consultSub').textContent = f.Subhead || '';
      document.getElementById('nameLabel').textContent = f['Name Label'] || '';
      document.getElementById('companyLabel').textContent = f['Company Label'] || '';
      document.getElementById('emailLabel').textContent = f['Email Label'] || '';
      document.getElementById('locationLabel').textContent = f['Location Label'] || '';
      document.getElementById('locationInput').placeholder = f['Location Placeholder'] || '';
      document.getElementById('typeLabel').textContent = f['Type Label'] || '';
      document.getElementById('projectType').innerHTML = (f['Type Options']||'').split('||').map(v=>`<option>${esc(v)}</option>`).join('');
      document.getElementById('messageLabel').textContent = f['Message Label'] || '';
      document.getElementById('messageInput').placeholder = f['Message Placeholder'] || '';
      document.getElementById('submitLabel').textContent = f['Submit Label'] || '';
      document.getElementById('mailtoFallback').innerHTML = `${esc(f['Fallback Prefix'])} <a href="mailto:${esc(site.Email)}?subject=${encodeURIComponent(site['Mailto Subject']||'')}">${esc(site.Email)}</a>`;
    }

    function wireInteractions(){
      document.querySelectorAll('.js-consult').forEach(b=>b.addEventListener('click',openConsult));
    }

    function openConsult(){
      const modal = document.getElementById('consultModal');
      modal.classList.add('open');
      document.body.style.overflow='hidden';
      setTimeout(()=>document.querySelector('#leadForm input[name="name"]')?.focus(),80);
    }
    function closeConsult(){
      document.getElementById('consultModal').classList.remove('open');
      document.body.style.overflow='';
    }

    function observeReveal(){
      const els=[...document.querySelectorAll('.reveal')];
      if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
      const io=new IntersectionObserver(entries=>entries.forEach(e=>{
        if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}
      }),{threshold:.08});
      els.forEach(e=>io.observe(e));
    }

    function wireEmbed(){
      try{
        if(window.self!==window.top){
          document.documentElement.classList.add('is-embedded');
          const sendHeight=()=>parent.postMessage({type:'base4-height',height:document.documentElement.scrollHeight},'*');
          new ResizeObserver(sendHeight).observe(document.body);
          sendHeight();
        }
      }catch(e){}
    }

    document.addEventListener('DOMContentLoaded',()=>{
      parseTSV(document.getElementById('content-tsv').textContent);
      renderNav();
      renderFooter();
      renderForm();
      renderPage();
      wireEmbed();

      const navToggle=document.getElementById('navToggle');
      navToggle.addEventListener('click',()=>document.getElementById('mainNav').classList.toggle('open'));

      window.addEventListener('scroll',()=>{
        document.getElementById('header').classList.toggle('scrolled',window.scrollY>20);
        document.getElementById('toTop').classList.toggle('show',window.scrollY>700);
      },{passive:true});

      document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
      document.getElementById('consultClose').addEventListener('click',closeConsult);
      document.getElementById('consultModal').addEventListener('click',e=>{if(e.target.id==='consultModal')closeConsult()});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')closeConsult()});

      document.getElementById('leadForm').addEventListener('submit',async e=>{
        e.preventDefault();
        const status=document.getElementById('formStatus');
        const site=kv('Site');
        const data=Object.fromEntries(new FormData(e.currentTarget).entries());
        if(data.company_website) return;
        status.hidden=false;
        status.textContent='Sending...';
        try{
          const res=await fetch(FORM_ENDPOINT,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({...data,source:site['Lead Source']||'Homepage'})
          });
          if(!res.ok) throw new Error('Request failed');
          status.textContent='Thank you. The BASE4 team will follow up.';
          e.currentTarget.reset();
        }catch(err){
          status.innerHTML=`Could not submit automatically. Please email <a href="mailto:${esc(site.Email)}">${esc(site.Email)}</a>.`;
        }
      });

      document.getElementById('newsletterForm').addEventListener('submit',async e=>{
        e.preventDefault();
        const status=document.getElementById('newsletterStatus');
        const site=kv('Site');
        const email=new FormData(e.currentTarget).get('email');
        status.hidden=false;
        status.textContent='Submitting...';
        try{
          const res=await fetch(FORM_ENDPOINT,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email,source:'Homepage Newsletter',newsletter_opt_in:true})
          });
          if(!res.ok) throw new Error('Request failed');
          status.textContent='Thank you. You are on the BASE4 updates list.';
          e.currentTarget.reset();
        }catch(err){
          status.innerHTML=`Could not submit automatically. Please contact <a href="mailto:${esc(site.Email)}" style="color:#fff">${esc(site.Email)}</a>.`;
        }
      });
    });
  </script>
